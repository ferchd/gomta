name: Feature request
description: Propose a new capability or behavior for GoMTA
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. GoMTA is deliberately a small
        MTA, so features that belong in a separate service may be better
        implemented as a plugin.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: I need to route mail for a domain through a per-domain smarthost ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should GoMTA behave? Include configuration examples if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, external services, or other approaches you have tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SMTP listeners and session handling
        - Configuration and policy
        - Plugins and filtering
        - Delivery backends
        - Queue and retries
        - CLI and operations
        - Docker and deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I am willing to help test or implement this change.
          required: false
