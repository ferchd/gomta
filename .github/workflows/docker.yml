name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ferchd/gomta
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Require Docker Hub token for explicit publishing
        if: github.event_name == 'workflow_dispatch' && inputs.push && env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::error::DOCKERHUB_TOKEN secret is required to publish images"
          exit 1

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'ferchd' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=GoMTA
            org.opencontainers.image.description=Modular SMTP server and filtering MTA written in Go
            org.opencontainers.image.url=https://github.com/ferchd/gomta
            org.opencontainers.image.documentation=https://github.com/ferchd/gomta/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=MIT

      - name: Set build metadata
        id: build
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ (github.event_name == 'pull_request' || env.DOCKERHUB_TOKEN == '' || (github.event_name == 'workflow_dispatch' && !inputs.push)) && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ env.DOCKERHUB_TOKEN != '' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.DOCKERHUB_TOKEN != '' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          sbom: ${{ env.DOCKERHUB_TOKEN != '' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
